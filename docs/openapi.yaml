openapi: 3.0.3
info:
  title: Gym App API
  version: 1.0.0
  description: API para sesiones de entrenamiento, rangos, rutinas y ligas.
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
paths:
  /health:
    get:
      summary: Estado de la API y base de datos
      responses:
        "200":
          description: Base de datos conectada
        "503":
          description: Base de datos no disponible
  /auth/register:
    post:
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201": { description: Usuario creado }
        "400": { description: Datos inválidos }
        "409": { description: Email existente }
  /auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200": { description: Token emitido }
        "401": { description: Credenciales inválidas }
  /auth/refresh:
    post:
      summary: Rotar refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Nuevos tokens }
        "401": { description: Refresh token inválido }
  /auth/logout:
    post:
      summary: Revocar refresh token
      responses:
        "204": { description: Token revocado }
  /auth/password-reset/request:
    post:
      summary: Solicitar recuperación de contraseña
      responses:
        "200": { description: Solicitud aceptada }
  /auth/password-reset/confirm:
    post:
      summary: Confirmar nueva contraseña
      responses:
        "204": { description: Contraseña actualizada }
  /auth/email/verify:
    post:
      summary: Verificar email
      responses:
        "204": { description: Email verificado }
  /users/me:
    delete:
      summary: Eliminar la cuenta y sus datos
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cuenta eliminada }
  /workout-sessions:
    post:
      summary: Crear una sesión
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Sesión creada }
        "401": { description: Token inválido o ausente }
  /routines:
    get:
      summary: Listar rutinas del usuario
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Rutinas }
    post:
      summary: Crear rutina
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Rutina creada }
  /leagues:
    get:
      summary: Listar ligas del usuario
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Ligas }
  /leagues/discover:
    get:
      summary: Listar ligas disponibles para unirse
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Ligas no pertenecientes al usuario }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, gender, bodyweightKg]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        gender: { type: string, enum: [male, female] }
        bodyweightKg: { type: number, minimum: 1 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
